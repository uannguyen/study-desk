<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Idempotency</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #e9e6dc;
        display: flex;
        justify-content: center;
      }
      svg {
        width: 100%;
        max-width: 1024px;
        height: auto;
        display: block;
        background: #fbf9f2;
      }
      .s {
        stroke: #1d2433;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .s2 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: none;
      } /* nét mảnh, KHÔNG tô (fill:none thắng thuộc tính fill) */
      .s3 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      } /* nét mảnh, có tô: đặt fill="#..." */
      .t {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        text-anchor: middle;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .tl {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .blue {
        stroke: #2f80d8;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink {
        stroke: #1d2433;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <svg
      viewBox="0 0 1024 1996"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Idempotency: vì sao bị trùng, idempotency key và bốn tình huống server xử lý"
    >
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.2" fill="#cfcabb" />
        </pattern>
        <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.018"
            numOctaves="2"
            seed="7"
            result="n"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="n"
            scale="3"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <!-- mũi tên xanh dương (dùng với class .blue) -->
        <marker
          id="ah"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#2f80d8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
        <!-- mũi tên mực đen (dùng với class .ink) -->
        <marker
          id="ad"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#1d2433"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
        <!-- mũi tên lục -->
        <marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M1 1 L9 5 L1 9" fill="none" stroke="#2fa24a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fbf9f2" />
      <rect width="100%" height="100%" fill="url(#dots)" />

      <g filter="url(#wobble)">
        <!-- TIÊU ĐỀ -->
        <rect class="s" x="40" y="30" width="944" height="100" rx="16" fill="#bcd9f5" />
        <text class="t" x="512" y="95" font-size="42">Idempotency: gửi 5 lần = gửi 1 lần</text>
        <rect class="s" x="212" y="143" width="600" height="52" rx="26" fill="#f9c9b6" />
        <text class="t" x="512" y="179" font-size="30">retry và giao trùng là chuyện thường</text>

        <!-- ① VÌ SAO BỊ TRÙNG -->
        <g transform="translate(0 225)">
          <rect class="s" x="35" y="0" width="955" height="66" rx="12" fill="#c5def5" />
          <circle class="s" cx="72" cy="33" r="17" fill="#f9c9b6" />
          <text class="t" x="72" y="43" font-size="26" stroke-width="0.3">1</text>
          <text class="tl" x="104" y="47" font-size="34">Vì sao bị trùng? App không biết server đã làm chưa</text>
          <g transform="translate(0 80)">
            <rect class="s" x="35" y="0" width="955" height="390" rx="18" fill="#fffdf5" />
            <rect class="s" x="277" y="14" width="470" height="50" rx="12" fill="#fbd3b4" />
            <text class="t" x="512" y="50" font-size="32">Mạng timeout = mất tin</text>
            <!-- bong bóng nghĩ -->
            <circle class="s3" cx="140" cy="178" r="5" fill="#fff" />
            <circle class="s3" cx="150" cy="162" r="8" fill="#fff" />
            <ellipse class="s" cx="210" cy="118" rx="135" ry="32" fill="#fff" />
            <text class="t" x="210" y="126" font-size="24">Làm rồi hay chưa??</text>
            <!-- app (người) -->
            <g transform="translate(130 285)">
              <circle class="s" cx="0" cy="-78" r="14" fill="#ffe3c2" />
              <path class="s" d="M0 -64 V-26 M0 -52 L-20 -34 M0 -52 L20 -34 M0 -26 L-16 0 M0 -26 L16 0" fill="none" />
              <path class="s2" d="M-5 -72 q5 -5 10 0" />
            </g>
            <text class="t" x="130" y="318" font-size="24">App</text>
            <!-- server -->
            <rect class="s" x="770" y="170" width="170" height="110" rx="12" fill="#cfe0f5" />
            <text class="t" x="855" y="212" font-size="28">Server</text>
            <text class="t" x="855" y="250" font-size="24">đã trừ 100k</text>
            <path d="M896 186 l7 9 l15 -18" fill="none" stroke="#2fa24a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
            <!-- request đi -->
            <path class="blue" d="M235 215 L760 215" marker-end="url(#ah)" />
            <text class="t" x="497" y="198" font-size="24">POST /pay: trừ 100k</text>
            <!-- response mất -->
            <path class="ink" d="M760 262 L610 262" stroke-dasharray="8 8" />
            <path d="M550 247 l30 30 M580 247 l-30 30" fill="none" stroke="#d9453a" stroke-width="6" stroke-linecap="round" />
            <text class="t" x="600" y="305" font-size="22" style="fill:#d9453a;stroke:#d9453a">phản hồi bị mất</text>
            <rect x="55" y="340" width="905" height="34" rx="10" fill="#cfe0f5" />
            <text class="t" x="507" y="365" font-size="24">app gửi lại (retry) → server trừ thêm 100k lần 2</text>
          </g>
        </g>

        <!-- ② IDEMPOTENCY KEY -->
        <g transform="translate(0 725)">
          <rect class="s" x="35" y="0" width="955" height="66" rx="12" fill="#c5def5" />
          <circle class="s" cx="72" cy="33" r="17" fill="#f9c9b6" />
          <text class="t" x="72" y="43" font-size="26" stroke-width="0.3">2</text>
          <text class="tl" x="104" y="47" font-size="34">Idempotency key = thẻ gửi đồ ở siêu thị</text>
          <g transform="translate(0 80)">
            <rect class="s" x="35" y="0" width="955" height="390" rx="18" fill="#fffdf5" />
            <rect class="s" x="277" y="14" width="470" height="50" rx="12" fill="#fbd3b4" />
            <text class="t" x="512" y="50" font-size="32">Cùng một key, chỉ làm một lần</text>
            <!-- 3 request cùng key -->
            <rect class="s" x="45" y="100" width="270" height="52" rx="12" fill="#e3d9f7" />
            <text class="tl" x="60" y="134" font-size="22">lần 1 · key a1b2</text>
            <rect class="s" x="45" y="170" width="270" height="52" rx="12" fill="#e3d9f7" />
            <text class="tl" x="60" y="204" font-size="22">lần 2 retry · key a1b2</text>
            <rect class="s" x="45" y="240" width="270" height="52" rx="12" fill="#e3d9f7" />
            <text class="tl" x="60" y="274" font-size="22">lần 3 retry · key a1b2</text>
            <path class="blue" d="M315 126 L400 160" marker-end="url(#ah)" />
            <path class="blue" d="M315 196 L400 196" marker-end="url(#ah)" />
            <path class="blue" d="M315 266 L400 232" marker-end="url(#ah)" />
            <!-- server nhớ key -->
            <rect class="s" x="410" y="85" width="190" height="215" rx="14" fill="#cfe0f5" />
            <text class="t" x="505" y="125" font-size="30">Server</text>
            <g transform="translate(505 205) scale(1.3)">
              <path class="s" d="M-30 -22 v44 a30 10 0 0 0 60 0 v-44" fill="#bfd9f2" />
              <path class="s2" d="M-30 -2 a30 10 0 0 0 60 0 M-30 14 a30 10 0 0 0 60 0" />
              <ellipse class="s" cx="0" cy="-22" rx="30" ry="10" fill="#fffdf5" />
            </g>
            <text class="t" x="505" y="287" font-size="20">a1b2: đã gặp rồi</text>
            <!-- kết quả -->
            <path d="M600 142 L660 142" stroke="#2fa24a" stroke-width="3" fill="none" stroke-linecap="round" marker-end="url(#ag)" />
            <path class="ink" d="M600 252 L660 252" marker-end="url(#ad)" />
            <rect class="s" x="665" y="95" width="310" height="95" rx="14" fill="#cdebd0" />
            <g transform="translate(715 140) scale(0.8)">
              <path class="s" d="M-28 26 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b" /><ellipse class="s" cx="0" cy="26" rx="28" ry="9" fill="#f7da6a" />
              <path class="s" d="M-28 15 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b" /><ellipse class="s" cx="0" cy="15" rx="28" ry="9" fill="#f7da6a" />
              <path class="s" d="M-28 4 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b" /><ellipse class="s" cx="0" cy="4" rx="28" ry="9" fill="#f7da6a" />
              <path class="s" d="M-28 -7 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b" /><ellipse class="s" cx="0" cy="-7" rx="28" ry="9" fill="#f7da6a" />
              <text class="t" x="0" y="-18" font-size="26">$</text>
            </g>
            <text class="t" x="852" y="135" font-size="24">lần 1: xử lý thật</text>
            <text class="t" x="852" y="167" font-size="24">trừ 100k</text>
            <rect class="s" x="665" y="205" width="310" height="95" rx="14" fill="#fbd3b4" />
            <g transform="translate(715 262) scale(0.9)">
              <rect class="s" x="-9" y="-42" width="18" height="16" rx="8" fill="#e87a6a" />
              <rect class="s" x="-5" y="-28" width="10" height="16" fill="#f7da6a" />
              <rect class="s" x="-24" y="-14" width="48" height="10" rx="3" fill="#e87a6a" />
              <rect x="-26" y="6" width="52" height="26" rx="5" fill="none" stroke="#e0652d" stroke-width="2.5" style="stroke-dasharray:6 4" />
              <text class="t" x="0" y="26" font-size="17" style="fill:#e0652d;stroke:#e0652d">seen</text>
            </g>
            <text class="t" x="852" y="245" font-size="24">lần 2, 3: trả lại</text>
            <text class="t" x="852" y="277" font-size="24">kết quả cũ</text>
            <rect x="55" y="340" width="905" height="34" rx="10" fill="#cfe0f5" />
            <text class="t" x="507" y="365" font-size="24">key = thẻ số: đưa lại đúng thẻ thì nhận đúng ngăn cũ</text>
          </g>
        </g>

        <!-- ③ SERVER XỬ LÝ -->
        <g transform="translate(0 1225)">
          <rect class="s" x="35" y="0" width="955" height="66" rx="12" fill="#c5def5" />
          <circle class="s" cx="72" cy="33" r="17" fill="#f9c9b6" />
          <text class="t" x="72" y="43" font-size="26" stroke-width="0.3">3</text>
          <text class="tl" x="104" y="47" font-size="34">Server nhận request: bốn tình huống</text>
          <g transform="translate(0 80)">
            <rect class="s" x="35" y="0" width="955" height="510" rx="18" fill="#fffdf5" />
            <rect class="s" x="277" y="14" width="470" height="50" rx="12" fill="#fbd3b4" />
            <text class="t" x="512" y="50" font-size="32">Tra key trước, rồi mới xử lý</text>
            <!-- 4 ô -->
            <rect class="s" x="60" y="85" width="440" height="115" rx="14" fill="#cdebd0" />
            <text class="tl" x="78" y="127" font-size="28">Key mới</text>
            <text class="tl" x="78" y="167" font-size="22">chiếm key rồi xử lý nghiệp vụ</text>
            <rect class="s3" x="388" y="101" width="94" height="40" rx="10" fill="#fffdf5" />
            <text class="t" x="435" y="130" font-size="24">xử lý</text>

            <rect class="s" x="520" y="85" width="440" height="115" rx="14" fill="#bcd9f5" />
            <text class="tl" x="538" y="127" font-size="28">Key đã DONE</text>
            <text class="tl" x="538" y="167" font-size="22">trả lại response đã lưu</text>
            <rect class="s3" x="848" y="101" width="94" height="40" rx="10" fill="#fffdf5" />
            <text class="t" x="895" y="130" font-size="24">replay</text>

            <rect class="s" x="60" y="215" width="440" height="115" rx="14" fill="#fbd3b4" />
            <text class="tl" x="78" y="257" font-size="28">Key đang PROCESSING</text>
            <text class="tl" x="78" y="297" font-size="22">bảo client đợi rồi thử lại</text>
            <rect class="s3" x="388" y="231" width="94" height="40" rx="10" fill="#fffdf5" />
            <text class="t" x="435" y="260" font-size="24">409</text>

            <rect class="s" x="520" y="215" width="440" height="115" rx="14" fill="#e3d9f7" />
            <text class="tl" x="538" y="257" font-size="28">Key cũ, body khác</text>
            <text class="tl" x="538" y="297" font-size="22">client dùng sai key, báo lỗi</text>
            <rect class="s3" x="848" y="231" width="94" height="40" rx="10" fill="#fffdf5" />
            <text class="t" x="895" y="260" font-size="24">422</text>

            <!-- bẫy race -->
            <rect class="s" x="60" y="350" width="900" height="90" rx="14" fill="#fde4d0" />
            <g transform="translate(115 395) scale(0.85)">
              <polygon class="s" points="0,-38 40,30 -40,30" fill="#f7da6a" />
              <path class="ink" d="M0 -14 V6" style="stroke-width:5" />
              <circle class="s3" cx="0" cy="17" r="3.5" fill="#1d2433" />
            </g>
            <text class="tl" x="175" y="383" font-size="26">Bẫy: SELECT rồi mới INSERT → 2 request cùng lọt</text>
            <text class="tl" x="175" y="421" font-size="24" style="fill:#1f7a37;stroke:#1f7a37">Đúng: INSERT có UNIQUE, hoặc Redis SET key NX</text>
            <rect x="55" y="458" width="905" height="34" rx="10" fill="#cfe0f5" />
            <text class="t" x="507" y="483" font-size="24">ghi key và ghi nghiệp vụ nên chung một transaction</text>
          </g>
        </g>

        <text class="t" x="512" y="1845" font-size="20">Mã 409/422 là quy ước phổ biến, không phải chuẩn bắt buộc.</text>

        <!-- CÂU CHỐT -->
        <g transform="translate(0 1870)">
          <rect class="s" x="60" y="0" width="904" height="76" rx="16" fill="#fbe98a" />
          <text class="t" x="512" y="52" font-size="36">Retry là chắc chắn, nên thao tác tiền phải idempotent.</text>
          <path class="s2" d="M30 22 l14 8 M28 48 l16 -4 M994 22 l-14 8 M996 48 l-16 -4" stroke="#e0a800" />
        </g>
      </g>
    </svg>
    <script>
      // Xem như canvas: Space + kéo chuột (hoặc kéo nút giữa) để rê, lăn chuột để cuộn (Shift: ngang), Ctrl + lăn hoặc pinch để phóng tại con trỏ, phím 0 về toàn cảnh.
      // Hình dọc (cao hơn rộng) mở ra chiếm ~88% bề ngang, không ép cả hình vào khung nên chữ đủ to; lăn chuột để đọc xuống.
      // Chỉ đổi viewBox nên chữ nét ở mọi mức phóng. Khung nhìn trùng tỉ lệ file (render.sh) thì viewBox không đổi nên PNG vẫn chụp như cũ.
      (() => {
        const svg = document.querySelector("svg");
        const orig = svg.getAttribute("viewBox").split(/\s+/).map(Number);
        const portrait = orig[3] > orig[2];
        let home = orig.slice(),
          vb = orig.slice(),
          space = false,
          drag = null,
          moved = false;
        document.documentElement.style.cssText = "height:100%;overflow:hidden";
        document.body.style.cssText = "height:100%;align-items:center";
        Object.assign(svg.style, {
          width: "100vw",
          height: "100vh",
          maxWidth: "none",
          background: "none"
        });
        // nền width="100%" tính theo viewBox hiện tại → phóng là co mất; ghim về cỡ gốc
        svg.querySelectorAll('rect[width="100%"]').forEach((r) => {
          r.setAttribute("width", orig[2]);
          r.setAttribute("height", orig[3]);
        });
        const set = () => svg.setAttribute("viewBox", vb.join(" "));
        const unit = () =>
          Math.max(vb[2] / svg.clientWidth, vb[3] / svg.clientHeight); // đơn vị SVG trên 1px màn hình
        const fit = () => {
          home = orig.slice();
          if (!portrait || !svg.clientWidth || !svg.clientHeight) return;
          const w = orig[2] / 0.8,
            h = (w * svg.clientHeight) / svg.clientWidth; // hình chiếm ~88% bề ngang, canh giữa
          if (Math.abs(h / orig[3] - 1) > 0.02)
            home = [orig[0] - (w - orig[2]) / 2, orig[1], w, h];
        };
        const reset = () => {
          fit();
          vb = home.slice();
          moved = false;
          set();
        };
        reset();
        addEventListener("resize", () => {
          if (!moved) reset();
        });
        addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault();
            space = true;
            svg.style.userSelect = "none";
            if (!drag) svg.style.cursor = "grab";
          }
          if (e.key === "0") reset();
        });
        addEventListener("keyup", (e) => {
          if (e.code === "Space") {
            space = false;
            svg.style.userSelect = "";
            if (!drag) svg.style.cursor = "";
          }
        });
        svg.addEventListener("pointerdown", (e) => {
          if (!space && e.button !== 1) return;
          e.preventDefault(); // chặn trình duyệt bắt đầu bôi đen chữ khi kéo
          getSelection().removeAllRanges();
          drag = [e.clientX, e.clientY];
          svg.setPointerCapture(e.pointerId);
          svg.style.cursor = "grabbing";
        });
        svg.addEventListener("mousedown", (e) => {
          if (e.button === 1) e.preventDefault(); // chặn autoscroll của nút giữa
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const k = unit();
          vb[0] -= (e.clientX - drag[0]) * k;
          vb[1] -= (e.clientY - drag[1]) * k;
          drag = [e.clientX, e.clientY];
          moved = true;
          set();
        });
        svg.addEventListener("pointerup", () => {
          drag = null;
          svg.style.cursor = space ? "grab" : "";
        });
        svg.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const px = e.deltaMode ? 16 : 1; // Firefox báo delta theo dòng
            if (e.ctrlKey || e.metaKey) {
              const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(
                svg.getScreenCTM().inverse()
              );
              const w = Math.min(
                Math.max(vb[2] * Math.exp(e.deltaY * px * 0.002), orig[2] / 20),
                orig[2] * 4
              );
              const f = w / vb[2];
              vb = [
                p.x - (p.x - vb[0]) * f,
                p.y - (p.y - vb[1]) * f,
                vb[2] * f,
                vb[3] * f
              ];
            } else {
              const k = unit();
              vb[0] += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * px * k;
              vb[1] += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * px * k;
            }
            moved = true;
            set();
          },
          { passive: false }
        );
      })();
    </script>
  </body>
</html>
