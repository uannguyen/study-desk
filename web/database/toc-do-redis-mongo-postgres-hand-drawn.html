<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Redis vs Mongo vs Postgres</title>
    <meta name="repos" content="" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #e9e6dc;
        display: flex;
        justify-content: center;
      }
      svg {
        width: 100%;
        max-width: 1600px;
        height: auto;
        display: block;
        background: #fbf9f2;
      }
      .s {
        stroke: #1d2433;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .s2 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: none;
      } /* nét mảnh, KHÔNG tô (fill:none thắng thuộc tính fill) */
      .s3 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      } /* nét mảnh, có tô: đặt fill="#..." */
      .t {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        text-anchor: middle;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .tl {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .blue {
        stroke: #2f80d8;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink {
        stroke: #1d2433;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <!-- Chỉ cần đổi "1536" trong viewBox (2 rect nền dùng 100% nên tự khớp) + aria-label.
     Khổ rộng: đổi "1024" thành "1600", đổi max-width ở CSS thành 1600px, dời tiêu đề/pill phụ/câu chốt theo bảng toạ độ trong types/vertical.md. Giữ viewBox của svg chính đứng ĐẦU file: render.sh đọc nó.
     Mẹo: viết mỗi khối trong <g transform="translate(0 Y)"> với toạ độ cục bộ từ 0 — dời cả khối chỉ cần đổi Y. -->
    <svg
      viewBox="0 0 1600 1950"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="So sánh tốc độ Redis, MongoDB và Postgres: dữ liệu nằm đâu, vì sao Redis nhanh và trả giá gì, Mongo và Postgres thắng ở kiểu đọc nào"
    >
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.2" fill="#cfcabb" />
        </pattern>
        <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.018"
            numOctaves="2"
            seed="7"
            result="n"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="n"
            scale="3"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <!-- mũi tên xanh dương (dùng với class .blue) -->
        <marker
          id="ah"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#2f80d8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
        <!-- mũi tên mực đen (dùng với class .ink) -->
        <marker
          id="ad"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#1d2433"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
      </defs>

      <rect width="100%" height="100%" fill="#fbf9f2" />
      <rect width="100%" height="100%" fill="url(#dots)" />

      <g filter="url(#wobble)">
        <!-- TIÊU ĐỀ -->
        <rect class="s" x="40" y="30" width="1520" height="100" rx="16" fill="#bcd9f5"/>
        <text class="t" x="800" y="95" font-size="44">Redis, MongoDB, Postgres: ai nhanh nhất?</text>
        <rect class="s" x="370" y="143" width="860" height="52" rx="26" fill="#f9c9b6"/>
        <text class="t" x="800" y="179" font-size="28">Không có bảng xếp hạng: nhanh tuỳ dữ liệu nằm đâu và bạn hỏi gì</text>

        <!-- ① MỖI THẰNG LÀ GÌ -->
        <g transform="translate(0 225)">
          <rect class="s" x="35" y="0" width="1530" height="66" rx="12" fill="#c5def5"/>
          <text class="tl" x="55" y="45" font-size="34">① Mỗi thằng cất dữ liệu ở đâu?</text>

          <!-- Redis -->
          <rect class="s" x="35" y="86" width="480" height="400" rx="18" fill="#fffdf5"/>
          <rect class="s" x="75" y="100" width="400" height="50" rx="12" fill="#fbd3b4"/>
          <text class="t" x="275" y="136" font-size="30">Redis = giấy nhớ dán trên bàn</text>
          <g transform="translate(275 222) scale(1.25)">
            <g transform="rotate(-8)"><rect class="s" x="-62" y="-34" width="62" height="62" fill="#f7da6a"/><path class="s2" d="M-54 -14 h46 M-54 -2 h40 M-54 10 h44"/></g>
            <g transform="rotate(7)"><rect class="s" x="4" y="-36" width="62" height="62" fill="#f6a3c4"/><path class="s2" d="M12 -16 h46 M12 -4 h38 M12 8 h44"/></g>
            <circle class="s3" cx="-31" cy="-38" r="5" fill="#e9937a"/><circle class="s3" cx="35" cy="-38" r="5" fill="#6aa0d8"/>
          </g>
          <text class="t" x="275" y="320" font-size="23">dữ liệu nằm hẳn trong RAM</text>
          <text class="t" x="275" y="356" font-size="23">chỉ tra theo key: GET user:42</text>
          <text class="t" x="275" y="394" font-size="23" style="fill:#2f80d8;stroke:#2f80d8">key-value · NoSQL</text>
          <rect x="60" y="428" width="430" height="38" rx="10" fill="#cfe0f5"/>
          <text class="t" x="275" y="455" font-size="23">cache · session · lock · counter</text>

          <!-- Mongo -->
          <rect class="s" x="560" y="86" width="480" height="400" rx="18" fill="#fffdf5"/>
          <rect class="s" x="600" y="100" width="400" height="50" rx="12" fill="#fbd3b4"/>
          <text class="t" x="800" y="136" font-size="30">MongoDB = mỗi bạn một cặp</text>
          <g transform="translate(700 178) scale(1.5)">
            <path class="s" d="M0 0 h22 l5 7 h-27z" fill="#5cb87a"/>
            <rect class="s" x="0" y="7" width="66" height="52" rx="4" fill="#7fd098"/>
            <rect x="4" y="30" width="58" height="22" fill="#fffdf5"/>
            <text class="t" x="33" y="46" font-size="12" stroke-width="0.3">An·5A·9</text>
          </g>
          <g transform="translate(810 178) scale(1.5)">
            <path class="s" d="M0 0 h22 l5 7 h-27z" fill="#5cb87a"/>
            <rect class="s" x="0" y="7" width="66" height="52" rx="4" fill="#7fd098"/>
            <rect x="4" y="30" width="58" height="22" fill="#fffdf5"/>
            <text class="t" x="33" y="46" font-size="12" stroke-width="0.3">Bình·5A·8</text>
          </g>
          <text class="t" x="800" y="320" font-size="23">trên đĩa, phần hay đọc cache ở RAM</text>
          <text class="t" x="800" y="356" font-size="23">1 document chứa đủ hồ sơ</text>
          <text class="t" x="800" y="394" font-size="23" style="fill:#2fa24a;stroke:#2fa24a">document · NoSQL</text>
          <rect x="585" y="428" width="430" height="38" rx="10" fill="#cfe0f5"/>
          <text class="t" x="800" y="455" font-size="23">giỏi đọc nguyên một hồ sơ</text>

          <!-- Postgres -->
          <rect class="s" x="1085" y="86" width="480" height="400" rx="18" fill="#fffdf5"/>
          <rect class="s" x="1125" y="100" width="400" height="50" rx="12" fill="#fbd3b4"/>
          <text class="t" x="1325" y="136" font-size="30">Postgres = tủ hồ sơ nhiều sổ</text>
          <g transform="translate(1270 225) scale(1.35)">
            <path class="s" d="M-30 -22 v44 a30 10 0 0 0 60 0 v-44" fill="#bfd9f2"/><path class="s2" d="M-30 -2 a30 10 0 0 0 60 0 M-30 14 a30 10 0 0 0 60 0"/><ellipse class="s" cx="0" cy="-22" rx="30" ry="10" fill="#fffdf5"/>
          </g>
          <g transform="translate(1340 182)">
            <rect class="s" x="0" y="0" width="100" height="84" rx="6" fill="#ffffff"/>
            <rect class="s3" x="0" y="0" width="100" height="24" fill="#d9cdf2"/>
            <path class="s2" d="M0 44 H100 M0 64 H100 M45 24 V84"/>
          </g>
          <text class="t" x="1325" y="320" font-size="23">trên đĩa, phần hay đọc cache ở RAM</text>
          <text class="t" x="1325" y="356" font-size="23">nhiều bảng, ráp lại bằng JOIN</text>
          <text class="t" x="1325" y="394" font-size="23" style="fill:#7a5cc0;stroke:#7a5cc0">relational · SQL</text>
          <rect x="1110" y="428" width="430" height="38" rx="10" fill="#cfe0f5"/>
          <text class="t" x="1325" y="455" font-size="23">giỏi JOIN · aggregate · báo cáo</text>
        </g>

        <!-- ② REDIS NHANH VÌ ĐÂU -->
        <g transform="translate(0 751)">
          <rect class="s" x="35" y="0" width="1530" height="66" rx="12" fill="#cdebd0"/>
          <text class="tl" x="55" y="45" font-size="34">② Redis nhanh vì đâu, và trả giá gì?</text>

          <rect class="s" x="35" y="86" width="720" height="340" rx="18" fill="#fffdf5"/>
          <rect class="s" x="215" y="100" width="360" height="50" rx="12" fill="#fbd3b4"/>
          <text class="t" x="395" y="136" font-size="30">Nhanh vì đường đi ngắn</text>
          <g transform="translate(115 252) scale(1.3)">
            <rect class="s" x="-7" y="-46" width="14" height="9" rx="3" fill="#cbd3dc"/><path class="s2" d="M24 -28 l7 -7"/><circle class="s" cx="0" cy="3" r="34" fill="#fffdf5"/><path class="s3" d="M0 3 L0 -27 A30 30 0 0 1 30 3 Z" fill="#f9c0b4"/><path class="s2" d="M0 -29 v5 M29 3 h-5 M0 35 v-5 M-29 3 h5"/><path class="s" d="M0 3 L0 -22"/><circle class="s3" cx="0" cy="3" r="3.5" fill="#1d2433"/>
          </g>
          <text class="tl" x="200" y="200" font-size="24">RAM ~100 ns, SSD ~100 µs: chênh ~1000 lần</text>
          <text class="tl" x="200" y="252" font-size="24">lệnh đơn giản: không parse SQL, không planner</text>
          <text class="tl" x="200" y="304" font-size="24">1 luồng chạy lệnh: không lock, lệnh nào cũng atomic</text>
          <rect x="60" y="360" width="670" height="40" rx="10" fill="#cfe0f5"/>
          <text class="t" x="395" y="388" font-size="24">nhanh vì nằm trong RAM, không phải vì là NoSQL</text>

          <text class="t" x="800" y="240" font-size="26">nhưng</text>
          <path class="ink" d="M772 262 L828 262" marker-end="url(#ad)"/>

          <rect class="s" x="845" y="86" width="720" height="340" rx="18" fill="#fffdf5"/>
          <rect class="s" x="1025" y="100" width="360" height="50" rx="12" fill="#fbd3b4"/>
          <text class="t" x="1205" y="136" font-size="30">Cái giá phải trả</text>
          <g transform="translate(925 248) scale(1.3)">
            <path class="s" d="M-28 26 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b"/><ellipse class="s" cx="0" cy="26" rx="28" ry="9" fill="#f7da6a"/><path class="s" d="M-28 15 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b"/><ellipse class="s" cx="0" cy="15" rx="28" ry="9" fill="#f7da6a"/><path class="s" d="M-28 4 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b"/><ellipse class="s" cx="0" cy="4" rx="28" ry="9" fill="#f7da6a"/><path class="s" d="M-28 -7 v9 a28 9 0 0 0 56 0 v-9" fill="#f2b84b"/><ellipse class="s" cx="0" cy="-7" rx="28" ry="9" fill="#f7da6a"/><text class="t" x="0" y="-18" font-size="26">$</text>
          </g>
          <text class="tl" x="1010" y="200" font-size="24">sập có thể mất dữ liệu (RDB, AOF ~1 giây)</text>
          <text class="tl" x="1010" y="252" font-size="24">RAM đắt: đầy là phải đuổi key (LRU)</text>
          <text class="tl" x="1010" y="304" font-size="24">chỉ tìm theo key, không hỏi tuỳ ý được</text>
          <rect x="870" y="360" width="670" height="40" rx="10" fill="#cfe0f5"/>
          <text class="t" x="1205" y="388" font-size="24">→ làm cache phía trước, không làm source of truth</text>
        </g>

        <!-- ③ MONGO VS POSTGRES -->
        <g transform="translate(0 1217)">
          <rect class="s" x="35" y="0" width="1530" height="66" rx="12" fill="#e3d9f5"/>
          <text class="tl" x="55" y="45" font-size="34">③ Mongo vs Postgres: ai thắng?</text>

          <g transform="translate(135 250) scale(1.7)">
            <path class="s" d="M10 12 L34 36" fill="none" style="stroke-width:11"/><path d="M10 12 L34 36" fill="none" stroke="#f2b84b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle class="s" cx="-8" cy="-8" r="26" fill="#eaf4fd"/><path class="s2" d="M-24 4 l9 -11 l9 7 l12 -18" stroke="#e0652d"/><circle class="s3" cx="9" cy="-18" r="3" fill="#e0652d"/>
          </g>

          <rect class="s" x="660" y="88" width="445" height="58" rx="10" fill="#cdebd0"/>
          <text class="t" x="882" y="127" font-size="28">MongoDB</text>
          <rect class="s" x="1115" y="88" width="450" height="58" rx="10" fill="#e3d9f5"/>
          <text class="t" x="1340" y="127" font-size="28">Postgres</text>

          <g font-size="23">
            <rect class="s3" x="250" y="156" width="400" height="58" rx="8" fill="#f4ecd8"/>
            <text class="t" x="450" y="193">Lấy 1 bản ghi theo id</text>
            <rect class="s3" x="660" y="156" width="905" height="58" rx="8" fill="#fffdf5"/>
            <text class="t" x="1112" y="193">ngang nhau, dưới 1 ms · tốn nhất là đường mạng</text>

            <rect class="s3" x="250" y="220" width="400" height="58" rx="8" fill="#f4ecd8"/>
            <text class="t" x="450" y="257">Đọc nguyên hồ sơ 1 user</text>
            <rect class="s3" x="660" y="220" width="445" height="58" rx="8" fill="#d6f0d9"/>
            <text class="t" x="882" y="257">✓ thắng: đã embed, đọc 1 lần</text>
            <rect class="s3" x="1115" y="220" width="450" height="58" rx="8" fill="#fffdf5"/>
            <text class="t" x="1340" y="257">phải JOIN vài bảng</text>

            <rect class="s3" x="250" y="284" width="400" height="58" rx="8" fill="#f4ecd8"/>
            <text class="t" x="450" y="321">JOIN, aggregate, báo cáo</text>
            <rect class="s3" x="660" y="284" width="445" height="58" rx="8" fill="#fffdf5"/>
            <text class="t" x="882" y="321">$lookup được nhưng vất vả</text>
            <rect class="s3" x="1115" y="284" width="450" height="58" rx="8" fill="#d6f0d9"/>
            <text class="t" x="1340" y="321">✓ thắng: query planner lo</text>

            <rect class="s3" x="250" y="348" width="400" height="58" rx="8" fill="#f4ecd8"/>
            <text class="t" x="450" y="385">Ghi an toàn (chờ ghi đĩa)</text>
            <rect class="s3" x="660" y="348" width="905" height="58" rx="8" fill="#fffdf5"/>
            <text class="t" x="1112" y="385">ngang nhau khi bật cùng mức an toàn (j: true ↔ fsync)</text>
          </g>

          <rect class="s" x="35" y="430" width="1530" height="84" rx="14" fill="#fde3dc"/>
          <g transform="translate(92 474) scale(0.8)">
            <polygon class="s" points="0,-38 40,30 -40,30" fill="#f7da6a"/><path class="ink" d="M0 -14 V6" style="stroke-width:5"/><circle class="s3" cx="0" cy="17" r="3.5" fill="#1d2433"/>
          </g>
          <text class="tl" x="150" y="466" font-size="25">Bẫy: “Mongo nhanh hơn Postgres vì là NoSQL” → sai</text>
          <text class="tl" x="150" y="498" font-size="21">benchmark hay so khập khiễng: Mongo ghi không chờ journal, Postgres fsync mỗi lần commit</text>
        </g>

        <!-- CÂU CHỐT -->
        <g transform="translate(0 1771)">
          <path class="s2" d="M30 30 l14 8 M28 56 l16 -4 M1570 30 l-14 8 M1572 56 l-16 -4" stroke="#e0a800"/>
          <rect class="s" x="60" y="0" width="1480" height="112" rx="16" fill="#fbe98a"/>
          <text class="t" x="800" y="48" font-size="36">Nhanh hay chậm là do dữ liệu nằm ở RAM hay đĩa và bạn hỏi kiểu gì,</text>
          <text class="t" x="800" y="94" font-size="36">không phải do SQL hay NoSQL.</text>
          <text class="t" x="800" y="155" font-size="20">Số đo là bậc độ lớn để so sánh, không phải benchmark. Redis đứng trước làm cache, source of truth vẫn là Mongo hoặc Postgres.</text>
        </g>
      </g>
    </svg>
    <script>
      // Xem như canvas: Space + kéo chuột (hoặc kéo nút giữa) để rê, lăn chuột để cuộn (Shift: ngang), Ctrl + lăn hoặc pinch để phóng tại con trỏ, phím 0 về toàn cảnh.
      // Hình dọc (cao hơn rộng) mở ra chiếm ~88% bề ngang, không ép cả hình vào khung nên chữ đủ to; lăn chuột để đọc xuống.
      // Chỉ đổi viewBox nên chữ nét ở mọi mức phóng. Khung nhìn trùng tỉ lệ file (render.sh) thì viewBox không đổi nên PNG vẫn chụp như cũ.
      (() => {
        const svg = document.querySelector("svg");
        const orig = svg.getAttribute("viewBox").split(/\s+/).map(Number);
        const portrait = orig[3] > orig[2];
        let home = orig.slice(),
          vb = orig.slice(),
          space = false,
          drag = null,
          moved = false;
        document.documentElement.style.cssText = "height:100%;overflow:hidden";
        document.body.style.cssText = "height:100%;align-items:center";
        Object.assign(svg.style, {
          width: "100vw",
          height: "100vh",
          maxWidth: "none",
          background: "none"
        });
        // nền width="100%" tính theo viewBox hiện tại → phóng là co mất; ghim về cỡ gốc
        svg.querySelectorAll('rect[width="100%"]').forEach((r) => {
          r.setAttribute("width", orig[2]);
          r.setAttribute("height", orig[3]);
        });
        const set = () => svg.setAttribute("viewBox", vb.join(" "));
        const unit = () =>
          Math.max(vb[2] / svg.clientWidth, vb[3] / svg.clientHeight); // đơn vị SVG trên 1px màn hình
        const fit = () => {
          home = orig.slice();
          if (!portrait || !svg.clientWidth || !svg.clientHeight) return;
          const w = orig[2] / 0.8,
            h = (w * svg.clientHeight) / svg.clientWidth; // hình chiếm ~88% bề ngang, canh giữa
          if (Math.abs(h / orig[3] - 1) > 0.02)
            home = [orig[0] - (w - orig[2]) / 2, orig[1], w, h];
        };
        const reset = () => {
          fit();
          vb = home.slice();
          moved = false;
          set();
        };
        reset();
        addEventListener("resize", () => {
          if (!moved) reset();
        });
        addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault();
            space = true;
            svg.style.userSelect = "none";
            if (!drag) svg.style.cursor = "grab";
          }
          if (e.key === "0") reset();
        });
        addEventListener("keyup", (e) => {
          if (e.code === "Space") {
            space = false;
            svg.style.userSelect = "";
            if (!drag) svg.style.cursor = "";
          }
        });
        svg.addEventListener("pointerdown", (e) => {
          if (!space && e.button !== 1) return;
          e.preventDefault(); // chặn trình duyệt bắt đầu bôi đen chữ khi kéo
          getSelection().removeAllRanges();
          drag = [e.clientX, e.clientY];
          svg.setPointerCapture(e.pointerId);
          svg.style.cursor = "grabbing";
        });
        svg.addEventListener("mousedown", (e) => {
          if (e.button === 1) e.preventDefault(); // chặn autoscroll của nút giữa
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const k = unit();
          vb[0] -= (e.clientX - drag[0]) * k;
          vb[1] -= (e.clientY - drag[1]) * k;
          drag = [e.clientX, e.clientY];
          moved = true;
          set();
        });
        svg.addEventListener("pointerup", () => {
          drag = null;
          svg.style.cursor = space ? "grab" : "";
        });
        svg.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const px = e.deltaMode ? 16 : 1; // Firefox báo delta theo dòng
            if (e.ctrlKey || e.metaKey) {
              const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(
                svg.getScreenCTM().inverse()
              );
              const w = Math.min(
                Math.max(vb[2] * Math.exp(e.deltaY * px * 0.002), orig[2] / 20),
                orig[2] * 4
              );
              const f = w / vb[2];
              vb = [
                p.x - (p.x - vb[0]) * f,
                p.y - (p.y - vb[1]) * f,
                vb[2] * f,
                vb[3] * f
              ];
            } else {
              const k = unit();
              vb[0] += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * px * k;
              vb[1] += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * px * k;
            }
            moved = true;
            set();
          },
          { passive: false }
        );
      })();
    </script>
  </body>
</html>
