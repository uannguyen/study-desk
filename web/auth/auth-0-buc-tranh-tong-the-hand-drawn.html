<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bức tranh tổng quan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #e9e6dc;
        display: flex;
        justify-content: center;
      }
      svg {
        width: 100%;
        max-width: 1024px;
        height: auto;
        display: block;
        background: #fbf9f2;
      }
      .s {
        stroke: #1d2433;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .s2 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: none;
      } /* nét mảnh, KHÔNG tô (fill:none thắng thuộc tính fill) */
      .s3 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      } /* nét mảnh, có tô: đặt fill="#..." */
      .t {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        text-anchor: middle;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .tl {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .blue {
        stroke: #2f80d8;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink {
        stroke: #1d2433;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <!-- Chỉ cần đổi "1536" trong viewBox (2 rect nền dùng 100% nên tự khớp) + aria-label. Giữ viewBox của svg chính đứng ĐẦU file: render.sh đọc nó.
     Mẹo: viết mỗi khối trong <g transform="translate(0 Y)"> với toạ độ cục bộ từ 0 — dời cả khối chỉ cần đổi Y. -->
    <svg
      viewBox="0 0 1024 3716"
      xmlns="http://www.w3.org/2000/svg"
      role="img"
      aria-label="Cây tổng thể về auth: mục 0 hai câu hỏi authentication và authorization; 1 công cụ mật mã; 2 thứ ghép từ công cụ; 3 session và JWT; 4 OAuth2 và OIDC; chỗ hay bị thủng và phần đã làm ở FV"
    >
      <defs>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="3" cy="3" r="1.2" fill="#cfcabb" />
        </pattern>
        <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.018"
            numOctaves="2"
            seed="7"
            result="n"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="n"
            scale="3"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <!-- mũi tên xanh dương (dùng với class .blue) -->
        <marker
          id="ah"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#2f80d8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
        <!-- mũi tên mực đen (dùng với class .ink) -->
        <marker
          id="ad"
          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"
        >
          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#1d2433"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </marker>
        <g id="ck">
          <path
            d="M0 0 l7 9 l16 -18"
            fill="none"
            stroke="#2fa24a"
            stroke-width="4.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
        </g>
        <g id="xx">
          <path
            d="M0 0 l16 16 M16 0 l-16 16"
            fill="none"
            stroke="#d6453d"
            stroke-width="4.5"
            stroke-linecap="round"
          />
        </g>
      </defs>

      <rect width="100%" height="100%" fill="#fbf9f2" />
      <rect width="100%" height="100%" fill="url(#dots)" />

      <g filter="url(#wobble)">

        <rect

          y="143"

          height="52"

        <text class="t" x="512" y="178" font-size="26">
          Mỗi mục nằm đúng một chỗ · tầng sau dùng đồ của tầng trước

        <g transform="translate(0 225)">

          <text class="tl" x="578" y="260" font-size="22">sai thì lỗi 403</text>

          <text class="tl" x="89" y="359" font-size="22">bcrypt, argon2</text>

          </text>

          <rect

            <path

            <rect

            <path class="ink" d="M0 14 V24" />
          </g>
          <text class="t" x="512" y="246" font-size="27">Mã hoá đối xứng</text>
          <text class="t" x="512" y="274" font-size="21">

          </text>
          <text class="t" x="512" y="406" font-size="20">

          <rect

          <g transform="translate(829 184) scale(0.95)">

          <text class="t" x="824" y="246" font-size="27">
            Mã hoá bất đối xứng
          </text>
          <text class="t" x="824" y="274" font-size="21">
            hỏi: ai là người đã ký?
          </text>
          <rect
            class="s3"
            x="699"
            y="288"
            width="250"
            height="38"
            rx="10"
            fill="#fffdf5"
          />
          <text class="tl" x="713" y="313" font-size="22">RSA, ECDSA</text>
          <text class="t" x="824" y="354" font-size="20">
            cặp khoá public / private
          </text>
          <text class="t" x="824" y="380" font-size="20">

          </text>
          <text class="t" x="824" y="406" font-size="20">

          </text>

        <path class="blue" d="M512 1136 L512 1174" marker-end="url(#ah)" />

    <script>
      // Xem như canvas: Space + kéo chuột (hoặc kéo nút giữa) để rê, lăn chuột để cuộn (Shift: ngang), Ctrl + lăn hoặc pinch để phóng tại con trỏ, phím 0 về toàn cảnh.
      // Hình dọc (cao hơn rộng) mở ra chiếm ~88% bề ngang, không ép cả hình vào khung nên chữ đủ to; lăn chuột để đọc xuống.
      // Chỉ đổi viewBox nên chữ nét ở mọi mức phóng. Khung nhìn trùng tỉ lệ file (render.sh) thì viewBox không đổi nên PNG vẫn chụp như cũ.
      (() => {
        const svg = document.querySelector("svg");
        const orig = svg.getAttribute("viewBox").split(/\s+/).map(Number);
        const portrait = orig[3] > orig[2];
        let home = orig.slice(),
          vb = orig.slice(),
          space = false,
          drag = null,
          moved = false;
        document.documentElement.style.cssText = "height:100%;overflow:hidden";
        document.body.style.cssText = "height:100%;align-items:center";
        Object.assign(svg.style, {
          width: "100vw",
          height: "100vh",
          maxWidth: "none",
          background: "none"
        });
        // nền width="100%" tính theo viewBox hiện tại → phóng là co mất; ghim về cỡ gốc
        svg.querySelectorAll('rect[width="100%"]').forEach((r) => {
          r.setAttribute("width", orig[2]);
          r.setAttribute("height", orig[3]);
        });
        const set = () => svg.setAttribute("viewBox", vb.join(" "));
        const unit = () =>
          Math.max(vb[2] / svg.clientWidth, vb[3] / svg.clientHeight); // đơn vị SVG trên 1px màn hình
        const fit = () => {
          home = orig.slice();
          if (!portrait || !svg.clientWidth || !svg.clientHeight) return;
          const w = orig[2] / 0.8,
            h = (w * svg.clientHeight) / svg.clientWidth; // hình chiếm ~88% bề ngang, canh giữa
          if (Math.abs(h / orig[3] - 1) > 0.02)
            home = [orig[0] - (w - orig[2]) / 2, orig[1], w, h];
        };
        const reset = () => {
          fit();
          vb = home.slice();
          moved = false;
          set();
        };
        reset();
        addEventListener("resize", () => {
          if (!moved) reset();
        });
        addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault();
            space = true;
            svg.style.userSelect = "none";
            if (!drag) svg.style.cursor = "grab";
          }
          if (e.key === "0") reset();
        });
        addEventListener("keyup", (e) => {
          if (e.code === "Space") {
            space = false;
            svg.style.userSelect = "";
            if (!drag) svg.style.cursor = "";
          }
        });
        svg.addEventListener("pointerdown", (e) => {
          if (!space && e.button !== 1) return;
          e.preventDefault(); // chặn trình duyệt bắt đầu bôi đen chữ khi kéo
          getSelection().removeAllRanges();
          drag = [e.clientX, e.clientY];
          svg.setPointerCapture(e.pointerId);
          svg.style.cursor = "grabbing";
        });
        svg.addEventListener("mousedown", (e) => {
          if (e.button === 1) e.preventDefault(); // chặn autoscroll của nút giữa
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const k = unit();
          vb[0] -= (e.clientX - drag[0]) * k;
          vb[1] -= (e.clientY - drag[1]) * k;
          drag = [e.clientX, e.clientY];
          moved = true;
          set();
        });
        svg.addEventListener("pointerup", () => {
          drag = null;
          svg.style.cursor = space ? "grab" : "";
        });
        svg.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const px = e.deltaMode ? 16 : 1; // Firefox báo delta theo dòng
            if (e.ctrlKey || e.metaKey) {
              const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(
                svg.getScreenCTM().inverse()
              );
              const w = Math.min(
                Math.max(vb[2] * Math.exp(e.deltaY * px * 0.002), orig[2] / 20),
                orig[2] * 4
              );
              const f = w / vb[2];
              vb = [
                p.x - (p.x - vb[0]) * f,
                p.y - (p.y - vb[1]) * f,
                vb[2] * f,
                vb[3] * f
              ];
            } else {
              const k = unit();
              vb[0] += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * px * k;
              vb[1] += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * px * k;
            }
            moved = true;
            set();
          },
          { passive: false }
        );
      })();
    </script>
