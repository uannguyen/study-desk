<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>HMAC và chữ ký số</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap&subset=vietnamese"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        background: #e9e6dc;
        display: flex;
        justify-content: center;
      }
      svg {
        width: 100%;
        max-width: 1600px;
        height: auto;
        display: block;
        background: #fbf9f2;
      }
      .s {
        stroke: #1d2433;
        stroke-width: 2.5;
        stroke-linejoin: round;
        stroke-linecap: round;
      }
      .s2 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
        fill: none;
      } /* nét mảnh, KHÔNG tô (fill:none thắng thuộc tính fill) */
      .s3 {
        stroke: #1d2433;
        stroke-width: 1.8;
        stroke-linejoin: round;
        stroke-linecap: round;
      } /* nét mảnh, có tô: đặt fill="#..." */
      .t {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        text-anchor: middle;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .tl {
        font-family: "Patrick Hand", "Comic Sans MS", cursive;
        fill: #1d2433;
        stroke: #1d2433;
        stroke-width: 0.6;
      }
      .blue {
        stroke: #2f80d8;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .ink {
        stroke: #1d2433;
        stroke-width: 3;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </head>
  <body>
    <!-- Chỉ cần đổi "1536" trong viewBox (2 rect nền dùng 100% nên tự khớp) + aria-label.
     Khổ rộng: đổi "1024" thành "1600", đổi max-width ở CSS thành 1600px, dời tiêu đề/pill phụ/câu chốt theo bảng toạ độ trong types/vertical.md. Giữ viewBox của svg chính đứng ĐẦU file: render.sh đọc nó.
     Mẹo: viết mỗi khối trong <g transform="translate(0 Y)"> với toạ độ cục bộ từ 0 — dời cả khối chỉ cần đổi Y. -->
    <svg

        </pattern>
        <filter id="wobble" x="-5%" y="-5%" width="110%" height="110%">
          <feTurbulence
            type="fractalNoise"
            baseFrequency="0.018"
            numOctaves="2"
            seed="7"
            result="n"
          />
          <feDisplacementMap
            in="SourceGraphic"
            in2="n"
            scale="3"
            xChannelSelector="R"
            yChannelSelector="G"
          />
        </filter>
        <!-- mũi tên xanh dương (dùng với class .blue) -->
        <marker

          viewBox="0 0 10 10"
          refX="8"
          refY="5"
          markerWidth="7"
          markerHeight="7"
          orient="auto-start-reverse"

          <path
            d="M1 1 L9 5 L1 9"
            fill="none"
            stroke="#2f80d8"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"

        </marker>
        <!-- mũi tên mực đen (dùng với class .ink) -->
        <marker

          refY="5"

          markerHeight="7"

><g transform="translate(955 430) scale(0.85) scale(-1 1)"><path class="s" d="M-4 0 H38 M26 0 v15 M37 0 v11" fill="none" style="stroke-width:7"/><path d="M-4 0 H38 M26 0 v15 M37 0 v11" fill="none" stroke="#f7da6a" stroke-width="3" stroke-linecap="round"/><circle class="s" cx="-20" cy="0" r="18" fill="#f7da6a"/><circle class="s2" cx="-20" cy="0" r="6" fill="#fbf9f2"/></g><text class="t" x="645" y="480" font-size="22">private</text><text class="t" x="645" y="502" font-size="17">chỉ chủ ký</text><text class="t" x="955" y="480" font-size="22">public</text><text class="t" x="955" y="502" font-size="17">ai cũng kiểm</text><rect class="s3" x="585" y="540" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="645" y="573" font-size="22">Khoá</text><rect class="s3" x="705" y="540" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="860" y="573" font-size="22">private ký, public kiểm</text><rect class="s3" x="585" y="600" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="645" y="633" font-size="22">Ai ký</text><rect class="s3" x="705" y="600" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="860" y="633" font-size="22">chỉ bên giữ private</text><rect class="s3" x="585" y="660" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="645" y="693" font-size="22">Chối bỏ</text><rect class="s3" x="705" y="660" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="860" y="693" font-size="22">chống được</text><rect x="585" y="742" width="430" height="38" rx="10" fill="#cfe0f5"/><text class="t" x="800" y="769" font-size="24">chậm hơn, hợp đối tác và tiền</text></g><g><rect class="s" x="1085" y="220" width="480" height="580" rx="18" fill="#fffdf5"/><rect class="s" x="1125" y="236" width="400" height="54" rx="12" fill="#fbe98a"/><text class="t" x="1325" y="275" font-size="32">Thêm: chống replay</text><text class="t" x="1325" y="326" font-size="24">Vé xem phim có giờ và số vé:</text><text class="t" x="1325" y="354" font-size="24">vé cũ hoặc đã xé thì bị từ.</text><rect class="s" x="1105" y="423" width="120" height="46" rx="12" fill="#ffffff"/><text class="t" x="1165.0" y="452.6" font-size="20">nonce abc</text><path class="ink" d="M1230 446 L1270 446" marker-end="url(#ad)"/><g transform="translate(1325 445) scale(1.5)"><rect class="s" x="-7" y="-46" width="14" height="9" rx="3" fill="#cbd3dc"/><path class="s2" d="M24 -28 l7 -7"/><circle class="s" cx="0" cy="3" r="34" fill="#fffdf5"/><path class="s3" d="M0 3 L0 -27 A30 30 0 0 1 30 3 Z" fill="#f9c0b4"/><path class="s2" d="M0 -29 v5 M29 3 h-5 M0 35 v-5 M-29 3 h5"/><path class="s" d="M0 3 L0 -22"/><circle class="s3" cx="0" cy="3" r="3.5" fill="#1d2433"/></g><text class="t" x="1480" y="440" font-size="22">cửa sổ</text><text class="t" x="1480" y="466" font-size="22">2 phút</text><rect class="s3" x="1110" y="540" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="1170" y="573" font-size="22">Ký kèm</text><rect class="s3" x="1230" y="540" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="1385" y="573" font-size="22">timestamp + nonce</text><rect class="s3" x="1110" y="600" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="1170" y="633" font-size="22">Quá giờ</text><rect class="s3" x="1230" y="600" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="1385" y="633" font-size="22">từ chối sau 2 phút</text><rect class="s3" x="1110" y="660" width="120" height="50" rx="10" fill="#bcd9f5"/><text class="t" x="1170" y="693" font-size="22">Nonce</text><rect class="s3" x="1230" y="660" width="310" height="50" rx="10" fill="#ffffff"/><text class="t" x="1385" y="693" font-size="22">Redis SET NX, TTL 120s</text><rect x="1110" y="742" width="430" height="38" rx="10" fill="#cfe0f5"/><text class="t" x="1325" y="769" font-size="24">chữ ký không tự chống gửi lại</text></g>
        <rect class="s" x="35" y="830" width="830" height="66" rx="12" fill="#c5def5"/><text class="tl" x="55" y="877" font-size="36">Chọn cái nào? Một câu hỏi</text><rect class="s" x="35" y="915" width="380" height="64" rx="12" fill="#bcd9f5"/><text class="t" x="225.0" y="955.58" font-size="26">Cần chống chối bỏ không?</text><path class="ink" d="M415 947 L560 947" marker-end="url(#ad)"/><text class="t" x="488" y="935" font-size="22">Cần</text><rect class="s" x="565" y="915" width="300" height="64" rx="12" fill="#e1d8f7"/><text class="t" x="715.0" y="955.58" font-size="26">3.2 Chữ ký số</text><text class="t" x="715" y="1004" font-size="20">đối tác ngoài, tranh chấp tiền</text><path class="ink" d="M225 979 L225 1008" marker-end="url(#ad)"/><text class="t" x="285" y="1001" font-size="22">Không cần</text><rect class="s" x="35" y="1010" width="380" height="64" rx="12" fill="#cdebd0"/><text class="t" x="225.0" y="1050.58" font-size="26">3.1 HMAC</text><text class="t" x="640" y="1050" font-size="22">mình giữ cả hai đầu: nội bộ, webhook</text><rect class="s" x="35" y="1105" width="830" height="64" rx="12" fill="#fbe98a"/><text class="t" x="450.0" y="1145.58" font-size="26">Dù chọn cái nào, vẫn ký kèm timestamp + nonce</text>

    <script>
      // Xem như canvas: Space + kéo chuột (hoặc kéo nút giữa) để rê, lăn chuột để cuộn (Shift: ngang), Ctrl + lăn hoặc pinch để phóng tại con trỏ, phím 0 về toàn cảnh.
      // Hình dọc (cao hơn rộng) mở ra chiếm ~88% bề ngang, không ép cả hình vào khung nên chữ đủ to; lăn chuột để đọc xuống.
      // Chỉ đổi viewBox nên chữ nét ở mọi mức phóng. Khung nhìn trùng tỉ lệ file (render.sh) thì viewBox không đổi nên PNG vẫn chụp như cũ.
      (() => {
        const svg = document.querySelector("svg");
        const orig = svg.getAttribute("viewBox").split(/\s+/).map(Number);
        const portrait = orig[3] > orig[2];
        let home = orig.slice(),
          vb = orig.slice(),
          space = false,
          drag = null,
          moved = false;
        document.documentElement.style.cssText = "height:100%;overflow:hidden";
        document.body.style.cssText = "height:100%;align-items:center";
        Object.assign(svg.style, {
          width: "100vw",
          height: "100vh",
          maxWidth: "none",
          background: "none"
        });
        // nền width="100%" tính theo viewBox hiện tại → phóng là co mất; ghim về cỡ gốc
        svg.querySelectorAll('rect[width="100%"]').forEach((r) => {
          r.setAttribute("width", orig[2]);
          r.setAttribute("height", orig[3]);
        });
        const set = () => svg.setAttribute("viewBox", vb.join(" "));
        const unit = () =>
          Math.max(vb[2] / svg.clientWidth, vb[3] / svg.clientHeight); // đơn vị SVG trên 1px màn hình
        const fit = () => {
          home = orig.slice();
          if (!portrait || !svg.clientWidth || !svg.clientHeight) return;
          const w = orig[2] / 0.8,
            h = (w * svg.clientHeight) / svg.clientWidth; // hình chiếm ~88% bề ngang, canh giữa
          if (Math.abs(h / orig[3] - 1) > 0.02)
            home = [orig[0] - (w - orig[2]) / 2, orig[1], w, h];
        };
        const reset = () => {
          fit();
          vb = home.slice();
          moved = false;
          set();
        };
        reset();
        addEventListener("resize", () => {
          if (!moved) reset();
        });
        addEventListener("keydown", (e) => {
          if (e.code === "Space") {
            e.preventDefault();
            space = true;
            svg.style.userSelect = "none";
            if (!drag) svg.style.cursor = "grab";
          }
          if (e.key === "0") reset();
        });
        addEventListener("keyup", (e) => {
          if (e.code === "Space") {
            space = false;
            svg.style.userSelect = "";
            if (!drag) svg.style.cursor = "";
          }
        });
        svg.addEventListener("pointerdown", (e) => {
          if (!space && e.button !== 1) return;
          e.preventDefault(); // chặn trình duyệt bắt đầu bôi đen chữ khi kéo
          getSelection().removeAllRanges();
          drag = [e.clientX, e.clientY];
          svg.setPointerCapture(e.pointerId);
          svg.style.cursor = "grabbing";
        });
        svg.addEventListener("mousedown", (e) => {
          if (e.button === 1) e.preventDefault(); // chặn autoscroll của nút giữa
        });
        svg.addEventListener("pointermove", (e) => {
          if (!drag) return;
          const k = unit();
          vb[0] -= (e.clientX - drag[0]) * k;
          vb[1] -= (e.clientY - drag[1]) * k;
          drag = [e.clientX, e.clientY];
          moved = true;
          set();
        });
        svg.addEventListener("pointerup", () => {
          drag = null;
          svg.style.cursor = space ? "grab" : "";
        });
        svg.addEventListener(
          "wheel",
          (e) => {
            e.preventDefault();
            const px = e.deltaMode ? 16 : 1; // Firefox báo delta theo dòng
            if (e.ctrlKey || e.metaKey) {
              const p = new DOMPoint(e.clientX, e.clientY).matrixTransform(
                svg.getScreenCTM().inverse()
              );
              const w = Math.min(
                Math.max(vb[2] * Math.exp(e.deltaY * px * 0.002), orig[2] / 20),
                orig[2] * 4
              );
              const f = w / vb[2];
              vb = [
                p.x - (p.x - vb[0]) * f,
                p.y - (p.y - vb[1]) * f,
                vb[2] * f,
                vb[3] * f
              ];
            } else {
              const k = unit();
              vb[0] += (e.shiftKey && !e.deltaX ? e.deltaY : e.deltaX) * px * k;
              vb[1] += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * px * k;
            }
            moved = true;
            set();
          },
          { passive: false }
        );
      })();
